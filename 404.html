<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Orion Sky Holiday</title>
  <meta name="description" content="The page you're looking for doesn't exist. Explore our destinations or plan your dream trip with Orion Sky Holiday.">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .error-page .header {
      position: relative;
    }
    .error-page main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
      background: linear-gradient(135deg, var(--primary) 0%, #0a3842 100%);
    }
    .error-content {
      max-width: 560px;
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 12vw, 9rem);
      font-weight: 700;
      color: rgba(255,255,255,0.12);
      line-height: 1;
      margin-bottom: 0;
    }
    .error-title {
      font-family: var(--font-heading);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      color: var(--white);
      margin: 16px 0;
    }
    .error-message {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 40px;
      line-height: 1.7;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body class="error-page">

  <!-- Header -->
  <header class="header header--solid">
    <div class="header__inner">
      <a href="index.html" class="header__logo" aria-label="Orion Sky Holiday — Home">
        <span class="header__logo-icon">
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="16" stroke="currentColor" stroke-width="2"/>
            <path d="M10 22 L18 10 L26 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="14" r="2.5" fill="currentColor"/>
          </svg>
        </span>
        Orion Sky Holiday
      </a>
      <div class="header__cta">
        <a href="plan-your-trip.html" class="btn btn--primary btn--sm">Get a Free Quote</a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div class="error-content">
      <p class="error-code">404</p>
      <h1 class="error-title">This journey took an unexpected turn.</h1>
      <p class="error-message">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div class="error-actions">
        <a href="index.html" class="btn btn--primary">Explore Destinations</a>
        <a href="plan-your-trip.html" class="btn btn--ghost">Plan Your Trip</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
