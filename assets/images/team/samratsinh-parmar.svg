<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgSamrat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefaf6"/>
      <stop offset="100%" stop-color="#ede3d5"/>
    </linearGradient>
    <linearGradient id="suitSamrat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3d59"/>
      <stop offset="100%" stop-color="#112233"/>
    </linearGradient>
    <linearGradient id="tieSamrat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e36414"/>
      <stop offset="100%" stop-color="#9a3e07"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgSamrat)" stroke="#e36414" stroke-width="3"/>
  
  <!-- Torso & Suit -->
  <path d="M 70 400 C 80 300 120 260 200 260 C 280 260 320 300 330 400 Z" fill="url(#suitSamrat)"/>
  
  <!-- White Dress Shirt -->
  <path d="M 160 260 L 200 330 L 240 260 Z" fill="#ffffff"/>
  
  <!-- Elegant Orange/Terracotta Tie -->
  <path d="M 194 270 L 206 270 L 210 340 L 200 365 L 190 340 Z" fill="url(#tieSamrat)"/>
  <polygon points="192,266 208,266 205,278 195,278" fill="#9a3e07"/>
  
  <!-- Suit Lapels -->
  <path d="M 140 260 L 175 340 L 190 265 Z" fill="#152b3d"/>
  <path d="M 260 260 L 225 340 L 210 265 Z" fill="#152b3d"/>
  
  <!-- Neck -->
  <rect x="176" y="200" width="48" height="65" rx="6" fill="#dda477"/>
  <!-- Shadow under chin -->
  <ellipse cx="200" cy="225" rx="24" ry="8" fill="#be8558" opacity="0.4"/>
  <!-- Head / Face -->
  <ellipse cx="200" cy="170" rx="58" ry="68" fill="#e5ad80"/>
  
  <!-- Trimmed Groomed Beard -->
  <path d="M 152 175 C 150 226 170 245 200 245 C 230 245 250 226 248 175 C 248 202 235 221 200 221 C 165 221 152 202 152 175 Z" fill="#201c1a"/>
  <ellipse cx="200" cy="208" rx="20" ry="6" fill="#201c1a" opacity="0.8"/>
  
  <!-- Hair: Modern side-parted executive hair -->
  <path d="M 136 160 C 130 90 165 72 200 72 C 238 72 265 92 264 160 C 255 106 225 88 195 88 C 165 88 145 110 136 160 Z" fill="#181514"/>
  <ellipse cx="140" cy="155" rx="10" ry="16" fill="#181514"/>
  <ellipse cx="260" cy="155" rx="10" ry="16" fill="#181514"/>
  
  <!-- Eyes -->
  <ellipse cx="178" cy="162" rx="7" ry="4.5" fill="#241408"/>
  <ellipse cx="222" cy="162" rx="7" ry="4.5" fill="#241408"/>
  <circle cx="176" cy="160" r="2" fill="#fff"/>
  <circle cx="220" cy="160" r="2" fill="#fff"/>
  
  <!-- Eyebrows -->
  <path d="M 166 150 Q 178 144 190 149" stroke="#181514" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 210 149 Q 222 144 234 150" stroke="#181514" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Nose -->
  <path d="M 200 158 L 197 182 L 204 183" stroke="#be8558" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Warm Executive Smile -->
  <path d="M 184 200 Q 200 214 216 200" fill="#201c1a"/>
  <path d="M 186 200 Q 200 208 214 200" fill="#ffffff"/>
</svg>
