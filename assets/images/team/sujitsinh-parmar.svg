<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgSujit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f8f8"/>
      <stop offset="100%" stop-color="#ddeae9"/>
    </linearGradient>
    <linearGradient id="suitSujit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4965"/>
      <stop offset="100%" stop-color="#0b253a"/>
    </linearGradient>
    <linearGradient id="tieSujit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fa8d3"/>
      <stop offset="100%" stop-color="#2b6b8c"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgSujit)" stroke="#1b4965" stroke-width="3"/>
  
  <!-- Torso & Suit -->
  <path d="M 70 400 C 80 300 120 260 200 260 C 280 260 320 300 330 400 Z" fill="url(#suitSujit)"/>
  
  <!-- White Dress Shirt -->
  <path d="M 160 260 L 200 330 L 240 260 Z" fill="#ffffff"/>
  
  <!-- Blue Patterned Tie -->
  <path d="M 194 270 L 206 270 L 210 340 L 200 365 L 190 340 Z" fill="url(#tieSujit)"/>
  <polygon points="192,266 208,266 205,278 195,278" fill="#2b6b8c"/>
  
  <!-- Suit Lapels -->
  <path d="M 140 260 L 175 340 L 190 265 Z" fill="#153b52"/>
  <path d="M 260 260 L 225 340 L 210 265 Z" fill="#153b52"/>
  
  <!-- Neck -->
  <rect x="176" y="200" width="48" height="65" rx="6" fill="#dda477"/>
  <!-- Shadow under chin -->
  <ellipse cx="200" cy="225" rx="24" ry="8" fill="#be8558" opacity="0.4"/>
  <!-- Head / Face -->
  <ellipse cx="200" cy="170" rx="58" ry="68" fill="#e5ad80"/>
  
  <!-- Neat Beard & Stubble -->
  <path d="M 152 175 C 150 225 170 244 200 244 C 230 244 250 225 248 175 C 248 200 235 220 200 220 C 165 220 152 200 152 175 Z" fill="#25201c"/>
  <ellipse cx="200" cy="208" rx="20" ry="6" fill="#25201c" opacity="0.8"/>
  
  <!-- Hair: Styled with slight volume -->
  <path d="M 136 160 C 130 95 160 70 200 70 C 235 70 265 90 264 160 C 255 105 230 90 200 90 C 168 90 148 115 136 160 Z" fill="#1c1815"/>
  <ellipse cx="140" cy="155" rx="10" ry="16" fill="#1c1815"/>
  <ellipse cx="260" cy="155" rx="10" ry="16" fill="#1c1815"/>
  
  <!-- Eyes -->
  <ellipse cx="178" cy="162" rx="7" ry="4.5" fill="#241408"/>
  <ellipse cx="222" cy="162" rx="7" ry="4.5" fill="#241408"/>
  <circle cx="176" cy="160" r="2" fill="#fff"/>
  <circle cx="220" cy="160" r="2" fill="#fff"/>
  
  <!-- Confident Eyebrows -->
  <path d="M 166 150 Q 178 145 190 150" stroke="#1c1815" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 210 150 Q 222 145 234 150" stroke="#1c1815" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Nose -->
  <path d="M 200 158 L 197 182 L 204 183" stroke="#be8558" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Smile with white teeth -->
  <path d="M 184 200 Q 200 214 216 200" fill="#25201c"/>
  <path d="M 186 200 Q 200 208 214 200" fill="#ffffff"/>
</svg>
